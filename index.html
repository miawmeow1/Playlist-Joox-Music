<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nada — Web Player</title>
<style>
/* =========================================================
   1. TOKEN WARNA
   ========================================================= */
:root{
  --bg:#000; --sidebar-bg:#121212; --main-bg:#121212; --surface:#181818; --surface2:#282828;
  --text:#fff; --muted:#a7a7a7; --accent:#1ed760; --on-accent:#000; --danger:#ff6b6b;
  --line:rgba(255,255,255,.08);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f5f5; --sidebar-bg:#e4e4e4; --main-bg:#fff; --surface:#f0f0f0; --surface2:#e0e0e0;
    --text:#121212; --muted:#5c5c5c; --accent:#15a34a; --on-accent:#fff; --danger:#d93636; --line:rgba(0,0,0,.08);
  }
}
:root[data-theme="light"]{
  --bg:#f5f5f5; --sidebar-bg:#e4e4e4; --main-bg:#fff; --surface:#f0f0f0; --surface2:#e0e0e0;
  --text:#121212; --muted:#5c5c5c; --accent:#15a34a; --on-accent:#fff; --danger:#d93636; --line:rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#000; --sidebar-bg:#121212; --main-bg:#121212; --surface:#181818; --surface2:#282828;
  --text:#fff; --muted:#a7a7a7; --accent:#1ed760; --on-accent:#000; --danger:#ff6b6b; --line:rgba(255,255,255,.08);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,.row:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

/* =========================================================
   2. LAYOUT UTAMA
   ========================================================= */
.app{
  display:grid;grid-template-rows:minmax(0,1fr) 90px;grid-template-columns:280px minmax(0,1fr);
  height:100vh;height:100dvh;width:100vw;gap:8px;padding:8px;background:var(--bg);
  padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
}

/* Sidebar */
.sidebar{background:var(--sidebar-bg);border-radius:8px;display:flex;flex-direction:column;padding:8px;gap:8px;overflow:hidden;min-height:0}
.nav-box{display:flex;flex-direction:column;gap:14px;background:var(--surface);padding:16px;border-radius:8px}
.nav-box.flex-fill{flex:1;min-height:0}
.nav-item{display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px;color:var(--muted);transition:color .2s;text-align:left}
.nav-item:hover,.nav-item.active{color:var(--text)}
.library-header{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:700;font-size:14px}
.library-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0}
.lib-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;cursor:pointer;transition:background .15s;font-size:14px;font-weight:600}
.lib-item:hover,.lib-item.on{background:var(--surface2)}
.lib-item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.lib-empty{color:var(--muted);font-size:13px;line-height:1.5;padding:6px 4px}

/* Konten kanan */
.main-container{background:var(--main-bg);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0}
header{padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in srgb,var(--main-bg) 70%,transparent);backdrop-filter:blur(10px);z-index:10}
.search-bar{display:flex;align-items:center;background:var(--surface2);border-radius:999px;padding:8px 16px;gap:10px;width:360px;max-width:100%}
.search-bar input{background:none;border:0;color:var(--text);font:inherit;font-size:14px;width:100%;outline:none}
.search-bar input::placeholder{color:var(--muted)}
.header-right{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 16px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:700;font-size:13px;white-space:nowrap}
.chip.accent{background:var(--accent);color:var(--on-accent)}
.chip.alt{background:var(--surface2);color:var(--text)}
.chip.danger{background:var(--danger);color:#fff}
.chip .ic{width:16px;height:16px}
.round-btn{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.round-btn .ic{width:18px;height:18px}

.mobile-nav{display:none;gap:8px;padding:0 16px 8px}
.mobile-nav button{height:32px;padding:0 14px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:13px}
.mobile-nav button.on{background:var(--text);color:var(--bg)}

.content-body{flex:1;overflow-y:auto;padding:8px 24px 24px;min-height:0}
.hidden{display:none!important}
.section-title{font-size:22px;font-weight:800;margin:12px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.section-title .more-link{font-size:13px;color:var(--muted);font-weight:700;cursor:pointer}
.section-title .more-link:hover{color:var(--text)}
.section-title .cnt{font-size:13px;color:var(--muted);font-weight:500}

.trending-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--surface);padding:12px;border-radius:8px;cursor:pointer;transition:background .2s;display:flex;flex-direction:column;gap:8px;text-align:left}
.card:hover{background:var(--surface2)}
.card-art{width:100%;aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:48px;font-weight:800;color:#fff}
.card-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-artist{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.empty b{color:var(--text)}
.empty code{background:var(--surface2);padding:1px 6px;border-radius:4px;font-size:12px}

.tabs{display:flex;gap:8px;margin-top:8px}
.tab{height:32px;padding:0 14px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:13px}
.tab.on{background:var(--text);color:var(--bg)}

.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 12px;border-radius:6px;cursor:pointer;transition:background .15s}
.row:hover,.row.active{background:var(--surface)}
.row.active .t{color:var(--accent)}
.art{width:44px;height:44px;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;flex:none}
.art.sm{width:28px;height:28px;font-size:12px}
.art.dashed{background:transparent!important;border:2px dashed var(--muted);color:var(--muted)}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:none;gap:2px;align-items:flex-end;height:14px;width:14px;flex:none}
.row.active.playing .eq{display:flex}
.eq i{flex:1;background:var(--accent);border-radius:1px;height:30%;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.row .more{width:34px;height:34px;display:grid;place-items:center;color:var(--muted);border-radius:50%;flex:none}
.row .more:hover{color:var(--text);background:var(--surface2)}

.pl-head{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.pl-head h2{flex:1;margin:0;font-size:24px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-actions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 8px}

/* =========================================================
   3. PLAYER BAR
   ========================================================= */
.player-bar{grid-column:1 / -1;background:var(--sidebar-bg);border-radius:8px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);align-items:center;padding:0 16px;gap:16px}
.player-left{display:flex;align-items:center;gap:12px;min-width:0}
.player-left .art{width:56px;height:56px;background:var(--surface2);font-size:20px}
.player-meta{min-width:0;flex:1}
.player-meta .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-meta .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-center{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:620px;width:100%;margin:0 auto}
.player-controls{display:flex;align-items:center;gap:14px}
.ctrl{position:relative;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.ctrl:hover{color:var(--text)}
.ctrl.on{color:var(--accent)}
.ctrl[data-badge]::after{content:attr(data-badge);position:absolute;right:-2px;top:-2px;font-size:9px;font-weight:800;line-height:1;background:var(--accent);color:var(--on-accent);border-radius:6px;padding:2px 3px}
.ctrl .ic{width:20px;height:20px}
.ctrl.skip{color:var(--text)}
.ctrl.big{width:38px;height:38px;background:var(--text);color:var(--bg)}
.ctrl.big:hover{transform:scale(1.06);color:var(--bg)}
.ctrl.big .ic{width:18px;height:18px}
.progress-container{display:flex;align-items:center;gap:8px;width:100%;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress-container span{min-width:34px}
.progress-container span:first-child{text-align:right}
.player-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--muted)}
.player-right .vol{width:100px}

input[type=range]{-webkit-appearance:none;appearance:none;height:16px;background:transparent;margin:0;cursor:pointer;--pct:0%}
.progress-container input[type=range]{flex:1}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--text) var(--pct),var(--surface2) var(--pct))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--surface2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--text)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);margin-top:-4px;opacity:0;transition:opacity .15s}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--text);opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]:hover::-moz-range-thumb,input[type=range]:focus-visible::-moz-range-thumb{opacity:1}

/* =========================================================
   4. MODAL & TOAST
   ========================================================= */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.panel{width:min(440px,100%);max-height:80vh;overflow-y:auto;background:var(--surface);border-radius:14px;padding:18px 16px}
.panel h3{margin:0 4px 10px;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel p{margin:0 4px 14px;color:var(--muted);font-size:14px;line-height:1.5}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:11px 8px;border-radius:8px;text-align:left;font-size:15px;font-weight:600}
.opt:hover{background:var(--surface2)}
.opt .ic{width:20px;height:20px;flex:none;color:var(--muted)}
.opt .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .sub{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.opt .ck{color:var(--accent)}
.opt.danger,.opt.danger .ic{color:var(--danger)}
.panel input[type=text]{width:100%;height:44px;border-radius:8px;border:0;background:var(--surface2);color:var(--text);padding:0 14px;font:inherit;font-size:16px;margin-bottom:12px;outline:none}
.panel .btns{display:flex;gap:8px}
.panel .btns .chip{flex:1;height:42px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:700;font-size:13px;z-index:200;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* =========================================================
   5. HP / LAYAR SEMPIT
   ========================================================= */
@media(max-width:850px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;padding:0;gap:0}
  .sidebar{display:none}
  .main-container{border-radius:0}
  .mobile-nav{display:flex}
  header{padding:10px 16px}
  .content-body{padding:4px 16px 16px}
  .player-bar{grid-template-columns:minmax(0,1fr);border-radius:12px 12px 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));gap:6px}
  .player-left .art{width:44px;height:44px}
  .player-right{display:none}
  .toast{bottom:170px}
}
@media(max-width:520px){
  .search-bar{width:auto;flex:1}
  .chip .lbl{display:none}
  .chip{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){
  .eq i{animation:none;height:70%}
  .toast{transition:none}
}
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR KIRI -->
  <aside class="sidebar">
    <div class="nav-box">
      <button class="nav-item active" id="navHome"><span data-ic="home"></span>Beranda</button>
      <button class="nav-item" id="navLib"><span data-ic="library"></span>Koleksi Kamu</button>
    </div>
    <div class="nav-box flex-fill">
      <div class="library-header">
        <span>Playlist</span>
        <button class="round-btn" id="newPlBtn" title="Buat playlist baru" aria-label="Buat playlist baru"></button>
      </div>
      <ul class="library-list" id="sidebarPlaylists"></ul>
    </div>
  </aside>

  <!-- KONTEN UTAMA -->
  <main class="main-container">
    <header>
      <div class="search-bar">
        <span data-ic="search"></span>
        <input id="q" type="search" placeholder="Apa yang ingin kamu dengarkan?" aria-label="Cari lagu">
      </div>
      <div class="header-right">
        <button class="round-btn" id="themeBtn" title="Ganti tema" aria-label="Ganti tema"></button>
        <button class="chip accent" id="addBtn" title="Tambah file MP3"><span data-ic="plus"></span><span class="lbl">Tambah MP3</span></button>
      </div>
    </header>

    <nav class="mobile-nav" id="mobileNav" aria-label="Navigasi">
      <button data-go="home" class="on">Beranda</button>
      <button data-go="songs">Lagu</button>
      <button data-go="playlists">Playlist</button>
    </nav>

    <div class="content-body" id="mainContent">
      <!-- Beranda -->
      <div id="homeView">
        <div class="section-title">Trending songs <button class="more-link" id="showAllSongs">Tampilkan semua</button></div>
        <div class="trending-grid" id="trendingGrid"></div>
      </div>

      <!-- Lagu & Playlist -->
      <div id="songsView" class="hidden">
        <div class="tabs">
          <button class="tab on" id="tabSongs">Semua Lagu</button>
          <button class="tab" id="tabPlaylists">Playlist Kamu</button>
        </div>
        <div id="plHead"></div>
        <div class="section-title" id="listTitle"><span id="ltText">Semua lagu</span><span class="cnt" id="count"></span></div>
        <div class="list" id="list"></div>
      </div>
    </div>
  </main>

  <!-- PLAYER BAR -->
  <footer class="player-bar">
    <div class="player-left">
      <div class="art" id="playerArt">♪</div>
      <div class="player-meta">
        <div class="t" id="playerT">Pilih lagu</div>
        <div class="a" id="playerA">Nada</div>
      </div>
      <button class="ctrl" id="plBtn" title="Simpan ke playlist" aria-label="Simpan ke playlist"></button>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="ctrl" id="shuffleBtn" title="Acak" aria-label="Acak"></button>
        <button class="ctrl skip" id="prevBtn" title="Sebelumnya" aria-label="Sebelumnya"></button>
        <button class="ctrl big" id="playBtn" title="Putar" aria-label="Putar atau jeda"></button>
        <button class="ctrl skip" id="nextBtn" title="Berikutnya" aria-label="Berikutnya"></button>
        <button class="ctrl" id="repeatBtn" title="Ulangi: mati" aria-label="Ulangi"></button>
      </div>
      <div class="progress-container">
        <span id="tNow">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posisi lagu">
        <span id="tDur">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="ctrl" id="muteBtn" title="Bisukan" aria-label="Bisukan"></button>
      <input type="range" class="vol" id="vol" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </footer>

  <input type="file" id="file" accept="audio/*,.mp3" multiple hidden>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/* =========================================================================
   DAFTAR LAGU
   Taruh MP3 di folder  assets/musik/  (di samping file HTML ini), lalu tulis
   di sini. Ganti 'Artis' dengan nama artis yang sebenarnya kalau mau.
   Kalau nama file mengandung tanda kutip satu ('), tulis dengan \' seperti
   di contoh di bawah.
   ========================================================================= */
const DAFTAR_LAGU = [
  { file:'assets/musik/Zaman.mp3', title:'Zaman', artist:'Alkateri' },
  { file:'assets/musik/Baby.mp3', title:'Baby', artist:'Artis' },
  { file:'assets/musik/we fell in love in october.mp3', title:'We fell in love in october', artist:'Artis' },
  { file:'assets/musik/That Should Be Me.mp3', title:'That Should Be Me', artist:'Artis' },
  { file:'assets/musik/Dunia Yang Nanti.mp3', title:'Dunia Yang Nanti', artist:'Artis' },
  { file:'assets/musik/Menari-nari.mp3', title:'Menari-nari', artist:'Artis' },
  { file:'assets/musik/Merry Christmas, I miss you.mp3', title:'Merry Christmas, I miss you', artist:'Artis' },
  { file:'assets/musik/Merry Christmas, Please Don\'t Call.mp3', title:'Merry Christmas, Please Don\'t Call', artist:'Artis' },
  { file:'assets/musik/luther.mp3', title:'luther', artist:'Artis' },
  { file:'assets/musik/Nicole Kidman.mp3', title:'Nicole Kidman', artist:'Artis' },
  { file:'assets/musik/Shut It Down.mp3', title:'Shut It Down', artist:'Artis' },
  { file:'assets/musik/Timeless.mp3', title:'Timeless', artist:'Artis' },
  { file:'assets/musik/Kita Lewati Berdua.mp3', title:'Kita Lewati Berdua', artist:'Artis' },
  { file:'assets/musik/drop dead.mp3', title:'drop dead', artist:'Artis' },
  { file:'assets/musik/The Cure.mp3', title:'The Cure', artist:'Artis' },
  { file:'assets/musik/deja vu.mp3', title:'deja vu', artist:'Artis' },
  { file:'assets/musik/Ain\'t in LA.mp3', title:'Ain\'t in LA', artist:'Artis' },
  { file:'assets/musik/Save You Tears.mp3', title:'Save You Tears', artist:'Artis' },
  { file:'assets/musik/Hate That i made you love me.mp3', title:'Hate That i made you love me', artist:'Artis' },
  { file:'assets/musik/About You.mp3', title:'About You', artist:'Artis' },
  { file:'assets/musik/Negoro Angin.mp3', title:'Negoro Angin', artist:'Artis' },
  { file:'assets/musik/LANY - \'Cause You Have To (Official Lyric Video).mp3', title:'LANY - \'Cause You Have To', artist:'Artis' },
  { file:'assets/musik/Masa ini, Nanti, dan Masa Indah Lainnya.mp3', title:'Masa ini, Nanti, dan Masa Indah Lainnya', artist:'Artis' },
];

/* =========================================================
   A. IKON
   ========================================================= */
const P = {
  play:'<svg class="ic fill" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg class="ic fill" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  next:'<svg class="ic fill" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>',
  prev:'<svg class="ic fill" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>',

const store = {
  get(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const audio = new Audio();
audio.preload = 'metadata';

let library = [];
let queue = [];
let cur = -1;
let queueName = 'Semua lagu';
let view = 'home';            // 'home' | 'songs' | 'playlists' | 'detail'

/* =========================================================
   C. UTILITAS
   ========================================================= */
const hueOf = str => { let h = 0; for(let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360; return h; };
const grad = hue => `linear-gradient(135deg,hsl(${hue} 70% 48%),hsl(${(hue+55)%360} 70% 24%))`;
const fmt = s => (!isFinite(s) || s <= 0) ? '0:00' : Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
const byId = id => library.find(t => t.id === id);
const curTrack = () => cur >= 0 ? queue[cur] : null;
function setRange(el){ el.style.setProperty('--pct', (el.value / el.max * 100) + '%'); }
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function parseName(fileName){
  const base = fileName.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
  const parts = base.split(' - ');
  if(parts.length >= 2) return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
  return { artist: 'Lokal', title: base };
}
function paintArt(node, t){
  node.style.background = grad(hueOf(t.id));
  node.textContent = (t.title.trim()[0] || '♪').toUpperCase();
}

DAFTAR_LAGU.forEach(item => {

function closeModal(){ const m = $('#modal'); if(m) m.remove(); }
function showModal(title, build){
  closeModal();
  const m = el('div', 'modal'); m.id = 'modal';
  const p = el('div', 'panel');
  p.append(el('h3', '', title));
  build(p);
  m.append(p);
  m.addEventListener('click', e => { if(e.target === m) closeModal(); });
  document.body.append(m);
  const inp = p.querySelector('input[type=text]');
  if(inp) setTimeout(() => { inp.focus(); inp.select(); }, 40);
}
function opt(label, icon, fn, o = {}){
  const b = el('button', 'opt' + (o.danger ? ' danger' : ''));
  const ic = el('span'); ic.innerHTML = icon;
  const lab = el('span', 'lab', label);
  if(o.sub) lab.append(el('span', 'sub', o.sub));
  b.append(ic, lab);
  if(o.check){ const c = el('span', 'ck'); c.innerHTML = P.check; b.append(c); }
  b.addEventListener('click', fn);
  return b;
}
function askName(title, initial, okLabel, cb){
  showModal(title, p => {
    const inp = el('input'); inp.type = 'text'; inp.maxLength = 40; inp.placeholder = 'Nama playlist'; inp.value = initial || '';
    const submit = () => {
      const name = inp.value.trim();
      if(!name){ toast('Isi nama playlist dulu'); return; }
      closeModal(); cb(name);
    };
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
    const ok = el('button', 'chip accent', okLabel); ok.onclick = submit;
    const cancel = el('button', 'chip alt', 'Batal'); cancel.onclick = closeModal;
    const row = el('div', 'btns'); row.append(cancel, ok);
    p.append(inp, row);
  });
}
function confirmBox(title, msg, okLabel, cb){
  showModal(title, p => {
    p.append(el('p', '', msg));
    const ok = el('button', 'chip danger', okLabel); ok.onclick = () => { closeModal(); cb(); };
    const cancel = el('button', 'chip alt', 'Batal'); cancel.onclick = closeModal;
    const row = el('div', 'btns'); row.append(cancel, ok);
    p.append(row);
  });
}

/* =========================================================
   E. PLAYLIST
   ========================================================= */
function newPlaylist(name){
  const pl = { id:'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5), name, ids:[] };
  playlists.push(pl); savePl(); return pl;
}
function toggleIn(pl, id){
  const i = pl.ids.indexOf(id);
  if(i >= 0) pl.ids.splice(i, 1); else pl.ids.push(id);
  savePl();
  return i < 0;
}
const plTracks = pl => pl.ids.map(byId).filter(Boolean);

function pickPlaylist(track){
  showModal('Simpan ke playlist', p => {
    const box = el('div'); p.append(box);
    const draw = () => {
      box.textContent = '';
      playlists.forEach(pl => {
        box.append(opt(pl.name, P.folder, () => {
          const added = toggleIn(pl, track.id);
          toast(added ? 'Ditambahkan ke ' + pl.name : 'Dihapus dari ' + pl.name);
          draw(); render();
        }, { check: pl.ids.includes(track.id), sub: pl.ids.length + ' lagu' }));
      });
      box.append(opt('Playlist baru', P.plus, () => {
        askName('Playlist baru', '', 'Buat dan simpan', name => {
          const pl = newPlaylist(name); toggleIn(pl, track.id);
          toast('Disimpan ke ' + name); render();
        });
      }));
    };
    draw();
  });
}
function pickSongs(pl){
  showModal('Tambah lagu ke ' + pl.name, p => {
    if(!library.length){ p.append(el('p', '', 'Belum ada lagu. Tambahkan MP3 dulu.')); return; }
    const box = el('div'); p.append(box);
    const draw = () => {
      box.textContent = '';
      library.forEach(t => box.append(opt(t.title, P.listplus, () => { toggleIn(pl, t.id); draw(); render(); }, { check: pl.ids.includes(t.id), sub: t.artist })));
    };
    draw();
    const done = el('button', 'chip accent', 'Selesai'); done.style.cssText = 'width:100%;margin-top:10px';
    done.onclick = closeModal; p.append(done);
  });
}
function openActions(track){
  showModal(track.title, p => {
    p.append(opt('Simpan ke playlist', P.listplus, () => { closeModal(); pickPlaylist(track); }));
    const pl = playlists.find(x => x.id === openPl);
    if(view === 'detail' && pl){
      p.append(opt('Hapus dari playlist ini', P.trash, () => { toggleIn(pl, track.id); closeModal(); toast('Dihapus dari ' + pl.name); render(); }));
    }
    if(track.local){
      p.append(opt('Hapus dari daftar', P.trash, () => {
        const c = curTrack();
        if(c && c.id === track.id){ closeModal(); toast('Hentikan lagu ini dulu'); return; }
        library = library.filter(t => t.id !== track.id);
        closeModal(); render(); toast('Lagu dihapus dari daftar');
      }, { danger:true }));
    }
  });
}

const matches = t => !filter || (t.title + ' ' + t.artist).toLowerCase().includes(filter.toLowerCase());

function trackRow(t, list, idx, name){
  const row = el('div', 'row'); row.tabIndex = 0; row.dataset.id = t.id;
  const art = el('div', 'art'); paintArt(art, t);
  const meta = el('div', 'meta'); meta.append(el('div', 't', t.title), el('div', 'a', t.artist));
  const eq = el('div', 'eq'); eq.innerHTML = '<i></i><i></i><i></i>';
  const more = el('button', 'more'); more.innerHTML = P.more; more.setAttribute('aria-label', 'Menu lagu');
  more.addEventListener('click', e => { e.stopPropagation(); openActions(t); });
  row.append(art, meta, eq, more);
  const play = () => playFrom(list, idx, name);
  row.addEventListener('click', play);
  row.addEventListener('keydown', e => { if(e.key === 'Enter') play(); });
  return row;
}
function emptyBox(html){ const d = el('div', 'empty'); d.innerHTML = html; return d; }

function renderSidebar(){
  const ul = $('#sidebarPlaylists'); ul.textContent = '';
  if(!playlists.length){ ul.append(el('li', 'lib-empty', 'Belum ada playlist. Klik tombol + untuk membuat.')); return; }
  playlists.forEach(pl => {
    const li = el('li', 'lib-item' + (view === 'detail' && openPl === pl.id ? ' on' : ''));
    const art = el('div', 'art sm'); art.style.background = grad(hueOf(pl.id)); art.innerHTML = P.folder;
    li.append(art, el('div', 'nm', pl.name));
    li.addEventListener('click', () => openPlaylist(pl.id));
    ul.append(li);
  });
}
function renderHome(){
  const grid = $('#trendingGrid'); grid.textContent = '';
  if(!library.length){ grid.append(emptyBox('<b>Belum ada lagu</b><br>Klik <b>Tambah MP3</b> atau isi <code>DAFTAR_LAGU</code> di kode.')); return; }
  library.forEach((t, i) => {
    const card = el('button', 'card');
    const art = el('div', 'card-art'); paintArt(art, t);
    card.append(art, el('div', 'card-title', t.title), el('div', 'card-artist', t.artist));
    card.addEventListener('click', () => playFrom(library, i, 'Semua lagu'));
    grid.append(card);

}
function renderSongsView(){
  const list = $('#list'), head = $('#plHead');
  list.textContent = ''; head.textContent = '';
  $('#tabSongs').classList.toggle('on', view === 'songs');
  $('#tabPlaylists').classList.toggle('on', view === 'playlists' || view === 'detail');

  if(view === 'songs'){
    $('#listTitle').classList.remove('hidden');

    $('#count').textContent = library.length + ' lagu';

  }

  else if(view === 'playlists'){
    $('#listTitle').classList.remove('hidden');
    $('#ltText').textContent = 'Playlist kamu';
    $('#count').textContent = playlists.length + ' playlist';
    const add = el('div', 'row'); add.tabIndex = 0;
    const a = el('div', 'art dashed'); a.innerHTML = P.plus;
    const m = el('div', 'meta'); m.append(el('div', 't', 'Playlist baru'), el('div', 'a', 'Buat folder untuk mengelompokkan lagu'));
    add.append(a, m);
    const create = () => askName('Playlist baru', '', 'Buat', name => { const pl = newPlaylist(name); toast('Playlist dibuat'); openPlaylist(pl.id); });
    add.addEventListener('click', create);

    list.append(add);

      const meta = el('div', 'meta'); meta.append(el('div', 't', pl.name), el('div', 'a', pl.ids.length + ' lagu'));

      row.addEventListener('keydown', e => { if(e.key === 'Enter') openPlaylist(pl.id); });

    $('#listTitle').classList.add('hidden');
    const h = el('div', 'pl-head');
    const back = el('button', 'round-btn'); back.innerHTML = P.prev; back.setAttribute('aria-label', 'Kembali ke daftar playlist');
    back.onclick = () => setView('playlists');
    const title = el('h2', '', pl.name);
    const ed = el('button', 'round-btn'); ed.innerHTML = P.edit; ed.setAttribute('aria-label', 'Ganti nama playlist');
    ed.onclick = () => askName('Ganti nama playlist', pl.name, 'Simpan', n => { pl.name = n; savePl(); render(); });
    const del = el('button', 'round-btn'); del.innerHTML = P.trash; del.setAttribute('aria-label', 'Hapus playlist'); del.style.color = 'var(--danger)';
    del.onclick = () => confirmBox('Hapus playlist?', 'Playlist "' + pl.name + '" akan dihapus. File MP3-nya tidak ikut terhapus.', 'Hapus', () => {
      playlists = playlists.filter(x => x.id !== pl.id); savePl(); toast('Playlist dihapus'); setView('playlists');
    });
    h.append(back, title, ed, del);
    const acts = el('div', 'pl-actions');

    playB.onclick = () => { const all = plTracks(pl); if(all.length) playFrom(all, 0, pl.name); else toast('Playlist masih kosong'); };
    acts.append(addB, playB);
    head.append(h, acts);

    const all = plTracks(pl), shown = all.filter(matches);
    shown.forEach((t, i) => list.append(trackRow(t, shown, i, pl.name)));
    const missing = pl.ids.length - all.length;
    if(!all.length && !missing) list.append(emptyBox('<b>Playlist masih kosong</b><br>Klik <b>Tambah lagu</b> atau pakai menu ⋯ pada lagu mana pun.'));
    else if(!shown.length && all.length) list.append(emptyBox('Tidak ada lagu yang cocok di playlist ini.'));
    if(missing > 0) list.append(emptyBox(missing + ' lagu belum dimuat. Tambahkan lagi file MP3-nya lewat <b>Tambah MP3</b>, maka lagu itu muncul kembali di sini.'));
  }

function render(){
  $('#homeView').classList.toggle('hidden', view !== 'home');
  $('#songsView').classList.toggle('hidden', view === 'home');
  $('#navHome').classList.toggle('active', view === 'home');
  $('#navLib').classList.toggle('active', view !== 'home');

    const g = b.dataset.go;

  });

}
function setView(v){ view = v; filter = ''; $('#q').value = ''; render(); $('#mainContent').scrollTop = 0; }
function openPlaylist(id){ openPl = id; setView('detail'); }

function refreshActive(){
  const t = curTrack(), playing = !audio.paused && !!t;
  document.querySelectorAll('.row[data-id]').forEach(r => {
    const on = !!t && r.dataset.id === t.id;
    r.classList.toggle('active', on);
    r.classList.toggle('playing', on && playing);
  });
}

/* =========================================================
   G. PEMUTARAN
   ========================================================= */
function playFrom(list, idx, name){
  queue = list.slice(); queueName = name || 'Semua lagu';
  load(idx);
}
function load(i){
  if(i < 0 || i >= queue.length) return;
  cur = i; replayDone = false;
  const t = queue[i];
  audio.src = t.src;
  audio.play().catch(() => {});
  updateTrackUI();
}
function togglePlay(){
  if(cur < 0){
    if(!library.length){ toast('Tambahkan lagu dulu'); return; }
    playFrom(library, 0, 'Semua lagu'); return;
  }
  if(audio.paused) audio.play().catch(() => {}); else audio.pause();
}
function next(auto = false){
  const n = queue.length; if(!n) return;
  let i;
  if(shuffleOn && n > 1){ do { i = Math.floor(Math.random() * n); } while(i === cur); }
  else {
    i = cur + 1;
    if(i >= n){
      if(repeatMode === 1 || !auto) i = 0;
      else { audio.pause(); audio.currentTime = 0; updatePlayUI(); return; }
    }
  }
  load(i);
}
function prev(){
  if(!queue.length) return;
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  load((cur - 1 + queue.length) % queue.length);
}

audio.addEventListener('ended', () => {
  if(repeatMode === 2){ audio.currentTime = 0; audio.play(); }
  else if(repeatMode === 3 && !replayDone){ replayDone = true; audio.currentTime = 0; audio.play(); }  // ulangi 1x, lalu lanjut
  else next(true);
});
audio.addEventListener('play', updatePlayUI);
audio.addEventListener('pause', updatePlayUI);
audio.addEventListener('loadedmetadata', () => { $('#tDur').textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  if(!audio.duration || dragging) return;
  const seek = $('#seek');
  seek.value = Math.round(audio.currentTime / audio.duration * 1000); setRange(seek);
  $('#tNow').textContent = fmt(audio.currentTime);
});
audio.addEventListener('error', () => {
  const t = curTrack(); if(t) toast('Tidak bisa memutar "' + t.title + '". Cek nama file dan folder assets/musik.');
});

function updatePlayUI(){
  const playing = !audio.paused && cur >= 0;
  $('#playBtn').innerHTML = playing ? P.pause : P.play;
  $('#playBtn').title = playing ? 'Jeda' : 'Putar';
  refreshActive();
}
function updateTrackUI(){
  const t = curTrack(); if(!t) return;
  paintArt($('#playerArt'), t);
  $('#playerT').textContent = t.title;
  $('#playerA').textContent = t.artist;
  $('#tNow').textContent = '0:00'; $('#tDur').textContent = '0:00';
  const seek = $('#seek'); seek.value = 0; setRange(seek);
  document.title = t.title + ' — Nada';
  if('mediaSession' in navigator && window.MediaMetadata){
    navigator.mediaSession.metadata = new MediaMetadata({ title:t.title, artist:t.artist });
  }
  updatePlayUI();
}

$('#shuffleBtn').onclick = e => {
  shuffleOn = !shuffleOn;
  e.currentTarget.classList.toggle('on', shuffleOn);
  toast(shuffleOn ? 'Acak aktif' : 'Acak mati');
};
const REPEAT_LABEL = ['Ulangi: mati', 'Ulangi semua lagu', 'Ulangi satu lagu terus', 'Ulangi 1x lalu lanjut'];
$('#repeatBtn').onclick = e => {
  repeatMode = (repeatMode + 1) % 4; replayDone = false;
  const b = e.currentTarget;
  b.innerHTML = repeatMode === 2 ? P.repeat1 : P.repeat;
  b.classList.toggle('on', repeatMode > 0);
  if(repeatMode === 3) b.dataset.badge = '1x'; else delete b.dataset.badge;
  b.title = REPEAT_LABEL[repeatMode];
  toast(REPEAT_LABEL[repeatMode]);
};

const seek = $('#seek');
seek.addEventListener('input', () => {
  dragging = true; setRange(seek);
  if(audio.duration) $('#tNow').textContent = fmt(seek.value / 1000 * audio.duration);
});
seek.addEventListener('change', () => {
  if(audio.duration) audio.currentTime = seek.value / 1000 * audio.duration;
  dragging = false;
});

const vol = $('#vol');
function applyVolume(){
  audio.volume = vol.value / 100; setRange(vol);
  $('#muteBtn').innerHTML = vol.value == 0 ? P.mute : P.vol;
}
vol.addEventListener('input', () => { if(vol.value > 0) lastVol = vol.value; applyVolume(); });
$('#muteBtn').onclick = () => { vol.value = vol.value == 0 ? lastVol : 0; applyVolume(); };
applyVolume();

$('#themeBtn').onclick = () => {
  const root = document.documentElement;
  const light = getComputedStyle(root).getPropertyValue('--main-bg').trim() === '#fff';
  root.dataset.theme = light ? 'dark' : 'light';
};
$('#newPlBtn').onclick = () => askName('Playlist baru', '', 'Buat', name => { newPlaylist(name); toast('Playlist dibuat'); render(); });

/* Tambah MP3 dari perangkat (hilang saat refresh; playlist-nya tetap tersimpan) */
$('#addBtn').onclick = () => $('#file').click();
$('#file').addEventListener('change', e => {
  let added = 0, dup = 0;
  [...e.target.files].forEach(f => {
    if(!f.type.startsWith('audio') && !/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(f.name)) return;
    const id = 'f:' + f.name + ':' + f.size;
    if(byId(id)){ dup++; return; }
    const p = parseName(f.name);
    library.push({ id, title:p.title, artist:p.artist, src:URL.createObjectURL(f), local:true });
    added++;
  });
  e.target.value = '';
  render();
  toast(added ? added + ' lagu ditambahkan' : dup ? 'Lagu itu sudah ada di daftar' : 'Tidak ada file audio yang dipilih');
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); return; }
  const tag = e.target.tagName;
  if(tag === 'INPUT' && e.target.type !== 'range') return;
  if(tag === 'BUTTON' && e.code === 'Space') return;
  if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  if(e.code === 'ArrowRight' && tag !== 'INPUT') next();
  if(e.code === 'ArrowLeft' && tag !== 'INPUT') prev();
});
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', prev);
  navigator.mediaSession.setActionHandler('nexttrack', () => next());
}

render();
</script>
</body>
</html>
